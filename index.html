<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2EC" />

    <title>GlowMouth | See Your Oral Health Differently</title>
    <meta
      name="description"
      content="GlowMouth is developing a new way to visualize and follow your oral health between dental visits. Join the waitlist."
    />

    <!-- Canonical base. This is the single place the production origin is declared;
         src/lib/site.ts mirrors it for anything that needs the value at runtime. -->
    <link rel="canonical" href="https://glowmouth.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlowMouth" />
    <meta property="og:url" content="https://glowmouth.com/" />
    <meta property="og:title" content="GlowMouth | See Your Oral Health Differently" />
    <meta
      property="og:description"
      content="GlowMouth is developing a new way to visualize and follow your oral health between dental visits. Join the waitlist."
    />
    <!-- Placeholder. Replace with a real 1200×630 render before launch. -->
    <meta property="og:image" content="https://glowmouth.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A GlowMouth concept device resting in open space." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlowMouth | See Your Oral Health Differently" />
    <meta
      name="twitter:description"
      content="GlowMouth is developing a new way to visualize and follow your oral health between dental visits. Join the waitlist."
    />
    <meta name="twitter:image" content="https://glowmouth.com/og-image.png" />

    <!-- Inline favicon so the tab mark never depends on a network fetch.
         Replace with the production mark when the identity is finalised. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316130F'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%238B5CFF' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GlowMouth",
        "url": "https://glowmouth.com/",
        "description": "GlowMouth is developing an at-home oral imaging system designed to help people visualize and follow changes in their oral health between dental visits.",
        "foundingDate": "2025"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="padding: 48px 24px; font-family: system-ui, sans-serif">
        GlowMouth is developing a new way to visualize and follow your oral health between dental
        visits. Please enable JavaScript to join the waitlist, or email hello@glowmouth.com.
      </p>
    </noscript>
  </body>
</html>
